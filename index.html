<style>

:root{
  --bg:#F7F3EA;
  --fg:#14120F;
  --card:#FFFFFF;
  --muted:#57544C;
  --red:#DA291C;
  --blue:#0047AB;
  --yellow:#FFC800;
  --border-w:3px;
  --shadow-off:6px;
  --font-disp:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#07070C;
  --fg:#E9E7F2;
  --card:#0D0D15;
  --muted:#ACAABF;
  --red:#FF2E7A;
  --blue:#29E5FF;
  --yellow:#FFAE34;
  --border-w:1px;
  --shadow-off:0px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  transition:background .15s linear,color .15s linear;
  overflow-x:hidden;
  position:relative;
}
[data-theme="dark"] body::before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  z-index:1;
  background:repeating-linear-gradient(0deg,rgba(41,229,255,0.025) 0px,rgba(41,229,255,0.025) 1px,transparent 1px,transparent 3px);
}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;position:relative;z-index:2;}

/* ---------- controls ---------- */
.controls{
  position:fixed;top:18px;right:18px;z-index:50;
  display:flex;gap:8px;
}
.ctrl-btn{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  background:var(--card);
  color:var(--fg);
  border:var(--border-w) solid var(--fg);
  padding:8px 12px;
  cursor:pointer;
  text-transform:uppercase;
  box-shadow:var(--shadow-off) var(--shadow-off) 0 var(--fg);
  position:relative;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
}
.ctrl-btn.toggle::before{
  content:"";
  position:absolute;
  top:4px;right:4px;
  width:5px;height:5px;
  background:var(--red);
}
[data-theme="dark"] .ctrl-btn.toggle::before{background:var(--blue);box-shadow:0 0 5px var(--blue);}
[data-theme="dark"] .ctrl-btn{
  border:1px solid var(--blue);
  box-shadow:0 0 10px rgba(41,229,255,0.25);
  color:var(--blue);
}
.ctrl-btn:hover{transform:translate(-2px,-2px);}
[data-theme="dark"] .ctrl-btn:hover{transform:none;box-shadow:0 0 16px rgba(41,229,255,0.5);}
.ctrl-btn:active{transform:translate(0,0);}

/* ---------- header ---------- */
header{
  padding:120px 0 60px;
  position:relative;
  border-bottom:var(--border-w) solid var(--fg);
  overflow:hidden;
}
[data-theme="dark"] header{border-bottom:1px solid #1c1c28;}
header::after{
  content:"";
}
[data-theme="dark"] header::after{
  content:"DON'T TRUST, VERIFY — DON'T TRUST, VERIFY — DON'T TRUST, VERIFY";
  position:absolute;
  right:-160px;top:38%;
  font-family:var(--font-mono);
  font-size:15px;
  letter-spacing:.25em;
  color:var(--blue);
  opacity:.05;
  white-space:nowrap;
  transform:rotate(-6deg);
  pointer-events:none;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:10px;
}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--red);display:inline-block;}
[data-theme="dark"] .eyebrow::before{border-radius:50%;box-shadow:0 0 8px var(--red);}

.header-row{display:flex;align-items:flex-start;gap:40px;flex-wrap:wrap;}

.name-block{flex:1;min-width:280px;}
h1{
  font-family:var(--font-disp);
  font-weight:700;
  font-size:clamp(42px,7vw,84px);
  line-height:.95;
  letter-spacing:-.02em;
  text-transform:uppercase;
}
h1 span{color:var(--red);}
.role{
  font-family:var(--font-mono);
  font-size:clamp(14px,2vw,19px);
  color:var(--muted);
  margin-top:14px;
  letter-spacing:.02em;
}
.ctrl-btn.icon-btn{display:flex;align-items:center;justify-content:center;padding:8px 11px;}
.ctrl-btn.icon-btn svg{display:block;}
[data-theme="dark"] .ctrl-btn.icon-btn svg{color:var(--blue);}
[data-theme="light"] .ctrl-btn.icon-btn svg{color:var(--fg);}

.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}

.tag.icon-tag{padding:9px 11px;}
.tag.icon-tag svg{display:block;}
.tag{
  font-family:var(--font-mono);
  font-weight:700;
  font-size:11.5px;
  padding:8px 13px;
  border:2px solid var(--fg);
  color:var(--fg);
  background:var(--card);
  text-decoration:none;
  letter-spacing:.02em;
  box-shadow:4px 4px 0 var(--fg);
  transition:transform .1s;
  display:inline-flex;
  align-items:center;
}
.tag:hover{transform:translate(-2px,-2px);}
[data-theme="dark"] .tag{
  border:1px solid #2a2a3a;
  color:var(--muted);
  background:transparent;
  box-shadow:none;
}
[data-theme="dark"] .tag:hover{border-color:var(--blue);color:var(--blue);transform:none;box-shadow:0 0 10px rgba(41,229,255,.3);}

/* ---------- summary band ---------- */
.summary{
  background:var(--yellow);
  color:#14120F;
  border-bottom:var(--border-w) solid var(--fg);
  padding:26px 0;
}
[data-theme="dark"] .summary{
  background:var(--card);
  border-bottom:1px solid #1c1c28;
  color:var(--fg);
  border-left:3px solid var(--yellow);
}
.summary p{
  font-size:clamp(15px,1.6vw,18px);
  line-height:1.55;
  max-width:760px;
  font-weight:500;
}
[data-theme="dark"] .summary p{font-weight:400;}

/* ---------- section shell ---------- */
section.block{padding:56px 0;}
.sec-title{
  font-family:var(--font-disp);
  font-weight:700;
  font-size:26px;
  text-transform:uppercase;
  letter-spacing:-.01em;
  margin-bottom:28px;
  padding-bottom:10px;
  border-bottom:2px solid var(--red);
  display:inline-block;
}
[data-theme="dark"] .sec-title{border-bottom:2px solid var(--blue);}

/* ---------- layout grid ---------- */
.layout{display:grid;grid-template-columns:320px 1fr;gap:0;border-top:var(--border-w) solid var(--fg);}
[data-theme="dark"] .layout{border-top:1px solid #1c1c28;}
.side{border-right:var(--border-w) solid var(--fg);padding:56px 32px 56px 0;}
[data-theme="dark"] .side{border-right:1px solid #1c1c28;}
.main{padding:56px 0 56px 40px;}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;}
  .side{border-right:none;border-bottom:var(--border-w) solid var(--fg);padding:40px 0;order:2;}
  [data-theme="dark"] .side{border-bottom:1px solid #1c1c28;}
  .main{padding:40px 0;order:1;}
}

/* ---------- expertise tags ---------- */
.expertise-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;padding-bottom:26px;border-bottom:1.5px dashed var(--muted);}
.expertise-list span{
  font-family:var(--font-mono);
  font-size:11px;
  padding:6px 10px;
  color:#fff;
  background:var(--fg);
}
[data-theme="dark"] .expertise-list span{
  background:transparent;
  border:1px solid var(--red);
  color:var(--red);
}
.expertise-list span:nth-child(3n+2){background:var(--red);}
[data-theme="dark"] .expertise-list span:nth-child(3n+2){border-color:var(--blue);color:var(--blue);}
.expertise-list span:nth-child(3n+3){background:var(--blue);}
[data-theme="dark"] .expertise-list span:nth-child(3n+3){border-color:var(--yellow);color:var(--yellow);}

/* ---------- skills cards ---------- */
.skill-card{
  border:var(--border-w) solid var(--fg);
  box-shadow:var(--shadow-off) var(--shadow-off) 0 var(--fg);
  background:var(--card);
  padding:16px 18px;
  margin-bottom:22px;
  border-top-width:6px;
}
[data-theme="dark"] .skill-card{
  border:1px solid #1c1c28;
  box-shadow:none;
  border-top-width:2px;
}
.skill-card:nth-child(3n+1){border-top-color:var(--red);}
.skill-card:nth-child(3n+2){border-top-color:var(--blue);}
.skill-card:nth-child(3n+3){border-top-color:var(--yellow);}
.skill-card h4{
  font-family:var(--font-mono);
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  margin-bottom:8px;
}
.skill-card p{font-size:14px;line-height:1.5;}

.edu-item{margin-bottom:20px;padding-bottom:20px;border-bottom:1.5px dashed var(--muted);}
.edu-item:last-child{border-bottom:none;}
.edu-item .deg{font-weight:600;font-size:14.5px;}
.edu-item .inst{font-size:13px;color:var(--muted);margin-top:3px;}
.edu-item .yr{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:3px;}

/* ---------- experience timeline ---------- */
.timeline{position:relative;padding-left:36px;}
.timeline::before{
  content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--fg);
}
[data-theme="dark"] .timeline::before{background:#1c1c28;}
.exp-item{position:relative;margin-bottom:46px;}
.exp-item:last-child{margin-bottom:0;}
.marker{
  position:absolute;left:-36px;top:4px;width:20px;height:20px;
  background:var(--card);border:2.5px solid var(--fg);
}
[data-theme="dark"] .marker{border:2px solid var(--blue);box-shadow:0 0 8px rgba(41,229,255,.4);}
.marker.circle{border-radius:50%;}
.marker.square{border-radius:0;}
.marker.diamond{border-radius:0;transform:rotate(45deg);}
.exp-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 16px;margin-bottom:6px;}
.exp-role{font-family:var(--font-disp);font-weight:700;font-size:19px;}
.exp-date{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap;}
.exp-company{font-size:14px;color:var(--muted);margin-bottom:12px;font-weight:500;}
.exp-company b{color:var(--fg);font-weight:600;}
.exp-item ul{list-style:none;}
.exp-item li{
  font-size:14.5px;line-height:1.55;padding-left:18px;position:relative;margin-bottom:8px;
}
.exp-item li::before{content:"—";position:absolute;left:0;color:var(--red);font-weight:700;}
[data-theme="dark"] .exp-item li::before{color:var(--blue);}

.earlier-block{margin-top:40px;padding-top:24px;border-top:1.5px dashed var(--muted);}
.earlier-block h4{
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  margin-bottom:14px;
}
.earlier-row{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;
  padding:10px 0;
  border-bottom:1px solid var(--muted);
  font-size:13.5px;
}
.earlier-row:last-child{border-bottom:none;}
.earlier-row .er-role{font-weight:600;}
.earlier-row .er-company{color:var(--muted);}
.earlier-row .er-date{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap;}

/* ---------- footer ---------- */
footer{
  border-top:var(--border-w) solid var(--fg);
  padding:60px 0 50px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
[data-theme="dark"] footer{border-top:1px solid #1c1c28;}
[data-theme="dark"] footer::before{
  content:"DON'T TRUST, VERIFY";
  position:absolute;
  left:50%;top:-6px;
  transform:translateX(-50%);
  font-family:var(--font-mono);
  font-size:64px;
  font-weight:700;
  letter-spacing:.1em;
  color:var(--blue);
  opacity:.035;
  white-space:nowrap;
  pointer-events:none;
}
footer .name-echo{
  font-family:var(--font-disp);
  font-weight:700;
  font-size:22px;
  letter-spacing:-.01em;
  text-transform:uppercase;
  margin-bottom:8px;
  position:relative;
}
footer .tagline{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--muted);
  margin-bottom:32px;
  position:relative;
}
.footer-links{
  display:flex;justify-content:center;flex-wrap:wrap;gap:10px;
  margin-bottom:36px;
  position:relative;
}
.footer-pdf{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  background:var(--red);
  color:#fff;
  border:2px solid var(--fg);
  padding:9px 14px;
  cursor:pointer;
  text-transform:uppercase;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  box-shadow:4px 4px 0 var(--fg);
}
.footer-pdf:hover{transform:translate(-2px,-2px);}
[data-theme="dark"] .footer-pdf{
  background:transparent;
  border:1px solid var(--red);
  color:var(--red);
  box-shadow:none;
}
[data-theme="dark"] .footer-pdf:hover{transform:none;box-shadow:0 0 10px rgba(255,46,122,.35);}
footer p.closing{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--muted);
  position:relative;
}

@media print{
  .controls{display:none;}
  [data-theme="dark"] body::before{display:none;}
}
</style>

const markers = ["circle","square","diamond"];

function render(){
  const state = document.body.getAttribute('data-lang');
  const c = content[state];

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(c[key] !== undefined) el.innerHTML = c[key];
  });

  document.getElementById('expertiseList').innerHTML =
    c.expertise.map(x=>`<span>${x}</span>`).join('');

  document.getElementById('skillsList').innerHTML =
    c.skills.map(([h,p])=>`<div class="skill-card"><h4>${h}</h4><p>${p}</p></div>`).join('');

  document.getElementById('eduList').innerHTML =
    c.education.map(([deg,inst,yr])=>`<div class="edu-item"><div class="deg">${deg}</div><div class="inst">${inst}</div><div class="yr">${yr}</div></div>`).join('');

  document.getElementById('expList').innerHTML =
    c.experience.map((e,i)=>`
      <div class="exp-item">
        <div class="marker ${markers[i%3]}"></div>
        <div class="exp-head">
          <div class="exp-role">${e.role}</div>
          <div class="exp-date">${e.date}</div>
        </div>
        <div class="exp-company"><b>${e.company}</b> · ${e.place}</div>
        <ul>${e.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      </div>
    `).join('');

  document.getElementById('earlierBlock').innerHTML =
    `<h4>${c.earlierTitle}</h4>` +
    c.earlier.map(e=>`<div class="earlier-row"><span><span class="er-role">${e.role}</span> · <span class="er-company">${e.company}</span></span><span class="er-date">${e.date}</span></div>`).join('');
}

const langBtn = document.getElementById('langBtn');
const themeBtn = document.getElementById('themeBtn');
const themeIconWrap = document.getElementById('themeBtn');

const sunIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
const moonIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

function updateLangBtn(){
  const cur = document.body.getAttribute('data-lang');
  langBtn.textContent = cur === 'en' ? 'ES ↗' : 'EN ↗';
}
function updateThemeBtn(){
  const cur = document.body.getAttribute('data-theme');
  themeIconWrap.innerHTML = cur === 'light' ? moonIcon : sunIcon;
}

langBtn.addEventListener('click', ()=>{
  const cur = document.body.getAttribute('data-lang');
  const next = cur === 'en' ? 'es' : 'en';
  document.body.setAttribute('data-lang', next);
  document.documentElement.setAttribute('lang', next);
  updateLangBtn();
  render();
});

themeBtn.addEventListener('click', ()=>{
  const cur = document.body.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.body.setAttribute('data-theme', next);
  updateThemeBtn();
});

updateLangBtn();
updateThemeBtn();
render();
</script>
